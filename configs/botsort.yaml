# BoT-SORT customizado com ReID visual — resistente a movimento rápido
tracker_type: botsort
track_high_thresh: 0.5
track_low_thresh: 0.1
new_track_thresh: 0.6
track_buffer: 300
match_thresh: 0.9
fuse_score: True
gmc_method: sparseOptFlow    # compensa movimento de câmera
proximity_thresh: 0.5
appearance_thresh: 0.25      # limiar de similaridade visual (menor = mais permissivo)
with_reid: True              # LIGA re-identificação visual
model: auto                  # usa o modelo ReID padrão do Ultralytics
